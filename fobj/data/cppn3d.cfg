# neat-python config for 3D voxel CPPNs.
#
# Inputs (in order): x, y, z, d, dxz -- voxel coordinates in [-1, 1], distance
# from the centre and distance from the vertical (y) axis.
# Outputs: density, hue, saturation, value, then 7 scene parameters read at
# the grid centre (bg r/g/b, shininess, specular, ambient, diffuse). Set
# num_outputs = 4 to use a fixed background and material instead.
#
# Only the [DefaultGenome] section drives MAP-Elites (mutation only, no
# crossover or speciation); the other sections are required by neat.Config.

[NEAT]
fitness_criterion     = max
fitness_threshold     = 1.0
pop_size              = 100
reset_on_extinction   = False
no_fitness_termination = True

[DefaultGenome]
num_inputs              = 5
num_hidden              = 0
num_outputs             = 11
initial_connection      = full_direct
feed_forward            = True
compatibility_disjoint_coefficient = 1.0
compatibility_weight_coefficient   = 0.5

# structural mutation (applied independently each time a child is made)
conn_add_prob           = 0.3
conn_delete_prob        = 0.05
node_add_prob           = 0.15
node_delete_prob        = 0.03
single_structural_mutation = False

# Picbreeder-style CPPN activation set (mirrors the old MultiNEAT setup:
# signed sigmoid, gauss, abs, sine, linear)
activation_default      = random
activation_options      = sin gauss tanh sigmoid abs identity
activation_mutate_rate  = 0.05

aggregation_default     = sum
aggregation_options     = sum
aggregation_mutate_rate = 0.0

bias_init_type          = gaussian
bias_init_mean          = 0.0
bias_init_stdev         = 1.0
bias_replace_rate       = 0.02
bias_mutate_rate        = 0.2
bias_mutate_power       = 0.3
bias_max_value          = 5.0
bias_min_value          = -5.0

response_init_mean      = 1.0
response_init_stdev     = 0.0
response_replace_rate   = 0.0
response_mutate_rate    = 0.0
response_mutate_power   = 0.0
response_max_value      = 5.0
response_min_value      = -5.0

weight_init_type        = gaussian
weight_init_mean        = 0.0
weight_init_stdev       = 1.5
weight_max_value        = 6.0
weight_min_value        = -6.0
weight_mutate_rate      = 0.8
weight_replace_rate     = 0.05
weight_mutate_power     = 0.4

enabled_default         = True
enabled_mutate_rate     = 0.01

[DefaultSpeciesSet]
compatibility_threshold = 3.0

[DefaultStagnation]
species_fitness_func = max
max_stagnation       = 20
species_elitism      = 1

[DefaultReproduction]
elitism            = 2
survival_threshold = 0.2
